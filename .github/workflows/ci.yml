name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: rust-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --locked

      - name: Package smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/local/package-release.ps1

      - name: Artifact retention smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo run -q -p astragrid -- ops artifact-retention --root . --max-cache-age-days 14 --keep-dist-releases 2
